# Postgres único, schema-por-tenant (ver br.com.lojagenerica.multitenancy,
# Fase A) — substitui o SQLite compartilhado com o IMS que este projeto usava
# antes do pivot pra "Loja Genérica" multiempresa. O volume nomeado abaixo
# persiste os dados entre reinícios do container; backup por tenant é feito
# com `pg_dump --schema=<schema>`, não pelo volume inteiro.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lojagenerica}
      POSTGRES_USER: ${DB_USER:-lojagenerica}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lojagenerica}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lojagenerica}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SAAS_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-lojagenerica}
      DB_USER: ${DB_USER:-lojagenerica}
      DB_PASSWORD: ${DB_PASSWORD:-lojagenerica}
      # Em branco por padrão — sem elas o app sobe mesmo assim (Pix fica
      # indisponível, Google login some da tela). Defina de verdade num
      # arquivo .env ao lado deste compose (nunca commitado — ver .env.example)
      # antes de subir em produção.
      JWT_SECRET: ${JWT_SECRET:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}

  # Mantém o domínio público apontando pro IP público atual — a rede
  # provavelmente tem IP dinâmico, sem isso o domínio "quebra" toda vez que o
  # IP mudar. Sem DUCKDNS_TOKEN/DUCKDNS_DOMAIN definidos, o serviço só avisa
  # (uma vez) e fica ocioso — não fica reiniciando em loop.
  duckdns:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      DUCKDNS_DOMAIN: ${DUCKDNS_DOMAIN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$DUCKDNS_TOKEN" ] || [ -z "$$DUCKDNS_DOMAIN" ]; then
          echo "DUCKDNS_TOKEN e/ou DUCKDNS_DOMAIN nao configurados no .env — atualizacao de IP desativada.";
          sleep infinity;
        fi
        while true; do
          wget -q -O - "https://www.duckdns.org/update?domains=$$DUCKDNS_DOMAIN&token=$$DUCKDNS_TOKEN&ip=";
          echo " -- duckdns atualizado $$(date)";
          sleep 300;
        done

  # HTTPS automático (Let's Encrypt) pro domínio público — sem isso o site só
  # responde em http://IP:8080, sem certificado. Precisa das portas 80/443
  # liberadas/encaminhadas no roteador pro IP desta máquina.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
