spring:
  application:
    name: minimercadinho-saas
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # date_class=TEXT força o driver a gravar LocalDateTime como texto formatado
    # em vez do padrão dele (epoch millis como INTEGER) — sem isso, qualquer
    # SELECT via JPA numa coluna de data (created_at, data, pagamento_recebido_em
    # etc.) quebra com "Error parsing time stamp", porque o dialeto SQLite do
    # Hibernate espera ler texto, não um número.
    url: jdbc:sqlite:${SAAS_DB_PATH:./dev-data/rbp-sample.db}?date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss.SSS
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite so tolera bem 1 escritor por vez; pool pequeno + timeout de
      # espera evita "database is locked" quando o IMS tambem esta gravando
      # no mesmo arquivo ao mesmo tempo.
      maximum-pool-size: 4
      connection-init-sql: "PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000; PRAGMA foreign_keys=ON;"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
    show-sql: false

# SAAS_DB_PATH é o único ponto de configuração do caminho do rbp.db (o
# MESMO arquivo usado pelo IMS). Em dev aponta pro banco de amostra do
# repo do IMS (dev-data/rbp-sample.db, já commitado aqui); em produção
# (perfil docker), para o volume montado a partir de C:\ims_files\rbp.db
# da loja — ver docker-compose.yml.
# Módulo JWT portado do ParaisoPet (adapters/outbound/auth/jwt) — mesmas
# chaves, um único namespace "jwt.*" (o SaúdeMaisFarma tem "jwt.*" e
# "security.jwt.*" duplicados por acidente; não repetir isso aqui).
jwt:
  enabled: ${JWT_ENABLED:false}
  issuer: ${JWT_ISSUER:minimercadinho-saas}
  secret: ${JWT_SECRET:dev-secret-change-me-32-chars-min}
  accessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
  refreshTokenExpirationMinutes: ${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:43200}

# RefreshTokenJpaStore (component scan, default ligado) e o bean
# inMemoryStore de JwtAutoConfiguration (default ligado) resolvem pro mesmo
# tipo RefreshTokenStore — sem isto os dois colidem (bean ambíguo). Fixamos
# explicitamente em "jpa" pra persistir refresh token no mesmo rbp.db.
security:
  refresh:
    store: jpa

server:
  port: ${SERVER_PORT:8080}

---
spring:
  config:
    activate:
      on-profile: dev
jwt:
  enabled: true
logging:
  level:
    br.com.minimercadinho: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:sqlite:${SAAS_DB_PATH:/data/rbp.db}?date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss.SSS
