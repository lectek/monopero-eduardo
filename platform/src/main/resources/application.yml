spring:
  application:
    name: lojagenerica-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # Postgres único, schema-por-tenant (ver br.com.lojagenerica.multitenancy,
    # Fase A) — este bloco configura a conexão padrão do control plane
    # ("plataforma"); a troca de schema por request é feita em runtime pelo
    # MultiTenantConnectionProvider, não por esta URL.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lojagenerica}
    username: ${DB_USER:lojagenerica}
    password: ${DB_PASSWORD:lojagenerica}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # Sem "hibernate.dialect" explícito — Hibernate 6 detecta o dialeto
        # certo a partir da conexão JDBC; setar isso à mão só gera um warning
        # de depreciação (HHH90000025).
        format_sql: true
    show-sql: false
  # Desligado de propósito: o autoconfigure padrão do Spring Boot só conhece
  # 1 schema. PlataformaMigrationRunner/TenantMigrationRunner (Fase A) rodam
  # o Flyway manualmente — uma vez contra "plataforma", uma vez por schema
  # de tenant — usando os mesmos db/migration/{plataforma,tenant}.
  flyway:
    enabled: false

# Módulo JWT portado do ParaisoPet (adapters/outbound/auth/jwt) — mesmas
# chaves, um único namespace "jwt.*" (o SaúdeMaisFarma tem "jwt.*" e
# "security.jwt.*" duplicados por acidente; não repetir isso aqui).
# Sem toggle "jwt.enabled": num sistema multiempresa, autenticação nunca é
# opcional — um interruptor que desliga o JWT é também um interruptor que
# desliga o isolamento entre empresas (removido na Fase 0, junto com
# NoopAuthTokenFacade).
jwt:
  issuer: ${JWT_ISSUER:lojagenerica-platform}
  secret: ${JWT_SECRET:dev-secret-change-me-32-chars-min}
  accessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
  refreshTokenExpirationMinutes: ${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:43200}

# RefreshTokenJpaStore (component scan, default ligado) e o bean
# inMemoryStore de JwtAutoConfiguration (default ligado) resolvem pro mesmo
# tipo RefreshTokenStore — sem isto os dois colidem (bean ambíguo). Fixamos
# explicitamente em "jpa" pra persistir refresh token (schema "plataforma",
# ver Fase A).
security:
  refresh:
    store: jpa

server:
  port: ${SERVER_PORT:8080}

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    br.com.lojagenerica: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:lojagenerica}
