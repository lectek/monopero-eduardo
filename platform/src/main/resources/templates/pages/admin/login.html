<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel Admin — Rota das Praias</title>
  <link rel="icon" type="image/png" th:href="@{/images/logo-rota-das-praias.png}" />
  <link rel="stylesheet" th:href="@{/css/main.css(v=${#dates.createNow().time})}" />
</head>
<body class="body-flex admin-page">
  <main id="main-content" class="container mt-4 mb-8">
    <div class="card p-4 stack gap-16" style="max-width:360px;margin-inline:auto;margin-top:4rem;">
      <img th:src="@{/images/logo-rota-das-praias.png}" alt="Rota das Praias" style="max-width:180px;margin-inline:auto;" />
      <h1 class="text-base font-semibold">Painel Admin</h1>

      <div class="alert alert-error" id="login-erro" hidden></div>

      <form id="form-login-admin" class="stack gap-8">
        <input class="input" type="email" id="admin-email" placeholder="E-mail" required autofocus="autofocus" />
        <input class="input" type="password" id="admin-senha" placeholder="Senha" required />
        <button class="btn btn--primary" type="submit">Entrar</button>
      </form>

      <p style="font-size:0.85rem;">
        O acesso admin é criado pelo IMS (tela "Acesso admin do site"), não por aqui.
      </p>
    </div>
  </main>
  <script defer th:src="@{/js/admin/auth.js}"></script>
  <script defer th:src="@{/js/pages/admin/login.js}"></script>
</body>
</html>
