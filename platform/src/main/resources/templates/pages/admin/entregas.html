<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entregas — Painel Admin</title>
  <link rel="icon" type="image/png" th:href="@{/images/logo-rota-das-praias.png}" />
  <link rel="stylesheet" th:href="@{/css/main.css(v=${#dates.createNow().time})}" />
</head>
<body class="body-flex admin-page">
  <header th:replace="~{fragments/admin-nav :: nav}"></header>

  <main id="main-content" class="container mt-4 mb-8">
    <h1 class="text-base font-semibold mb-4">Entregas</h1>

    <section class="card p-4 mb-4">
      <h2 class="text-base font-semibold mb-2">Pedidos elegíveis para rota</h2>
      <div id="elegiveis-vazio" hidden><p>Nenhum pedido elegível para entrega no momento.</p></div>
      <div style="overflow-x:auto;">
        <table id="tabela-elegiveis" hidden>
          <thead>
            <tr>
              <th></th>
              <th>Pedido</th>
              <th>Cliente</th>
              <th>Endereço</th>
              <th>Total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="elegiveis-corpo"></tbody>
        </table>
      </div>

      <div class="stack gap-8 mt-4" style="max-width:420px;">
        <input class="input" id="origem-input" placeholder="Endereço de origem (a loja)" />
        <div style="display:flex;gap:0.5rem;">
          <button class="btn" id="btn-preview" type="button">Pré-visualizar rota</button>
          <button class="btn btn--primary" id="btn-criar-rota" type="button" disabled>Criar rota</button>
        </div>
      </div>

      <div id="preview-resultado" class="mt-4" hidden>
        <h3 class="text-base font-semibold">Prévia da rota</h3>
        <p id="preview-resumo"></p>
        <ol id="preview-paradas"></ol>
      </div>
    </section>

    <section class="card p-4">
      <h2 class="text-base font-semibold mb-2">Rotas recentes</h2>
      <div id="rotas-vazio" hidden><p>Nenhuma rota criada ainda.</p></div>
      <div style="overflow-x:auto;">
        <table id="tabela-rotas" hidden>
          <thead>
            <tr>
              <th>#</th>
              <th>Data</th>
              <th>Origem</th>
              <th>Distância</th>
              <th>Paradas</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rotas-corpo"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script defer th:src="@{/js/admin/auth.js}"></script>
  <script defer th:src="@{/js/pages/admin/entregas.js}"></script>
</body>
</html>
