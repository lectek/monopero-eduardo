<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pedidos — Painel Admin</title>
  <link rel="icon" type="image/png" th:href="@{/images/logo-rota-das-praias.png}" />
  <link rel="stylesheet" th:href="@{/css/main.css(v=${#dates.createNow().time})}" />
</head>
<body class="body-flex admin-page">
  <header th:replace="~{fragments/admin-nav :: nav}"></header>

  <main id="main-content" class="container mt-4 mb-8">
    <h1 class="text-base font-semibold mb-4">Pedidos</h1>

    <div id="pedidos-vazio" class="card p-4" hidden>
      <p>Nenhum pedido ainda.</p>
    </div>

    <div style="overflow-x:auto;">
      <table id="tabela-pedidos" hidden>
        <thead>
          <tr>
            <th>#</th>
            <th>Data</th>
            <th>Cliente</th>
            <th>Total</th>
            <th>Pagamento</th>
            <th>Entrega</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="pedidos-corpo"></tbody>
      </table>
    </div>
  </main>

  <script defer th:src="@{/js/admin/auth.js}"></script>
  <script defer th:src="@{/js/pages/admin/pedidos.js}"></script>
</body>
</html>
