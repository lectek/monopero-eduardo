<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rota de entrega — Painel Admin</title>
  <link rel="icon" type="image/png" th:href="@{/images/logo-rota-das-praias.png}" />
  <link rel="stylesheet" th:href="@{/css/main.css(v=${#dates.createNow().time})}" />
</head>
<body class="body-flex admin-page">
  <header th:replace="~{fragments/admin-nav :: nav}"></header>

  <main id="main-content" class="container mt-4 mb-8">
    <p><a th:href="@{/admin/entregas}">&larr; Voltar pra Entregas</a></p>
    <h1 class="text-base font-semibold mb-2" id="rota-titulo">Rota</h1>

    <section class="card p-4 mb-4">
      <div id="rota-resumo" class="stack gap-8"></div>
      <button class="btn btn--primary mt-4" id="btn-iniciar-rota" type="button" hidden>Iniciar rota</button>
    </section>

    <section class="card p-4">
      <h2 class="text-base font-semibold mb-2">Paradas</h2>
      <div id="paradas-lista" class="stack gap-16"></div>
    </section>
  </main>

  <script defer th:src="@{/js/admin/auth.js}"></script>
  <script defer th:src="@{/js/pages/admin/entrega-detalhe.js}"></script>
</body>
</html>
