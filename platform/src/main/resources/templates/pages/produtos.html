<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Produtos — Rota das Praias</title>
  <link rel="icon" type="image/png" th:href="@{/images/logo-rota-das-praias.png}" />
  <link rel="stylesheet" th:href="@{/css/main.css(v=${#dates.createNow().time})}"/>
</head>
<body class="body-flex">
<header th:replace="~{fragments/header :: header}"></header>

<main class="container stack mt-4 mb-8" id="main-content" role="main" aria-label="Produtos Rota das Praias">
  <div class="between mb-4">
    <h1 class="page-title">Produtos</h1>
    <form id="form-busca" class="form-row gap-2" role="search" aria-label="Buscar produtos">
      <input class="input" id="q" name="q" placeholder="Buscar por nome"/>
      <button class="btn" type="submit">Buscar</button>
      <button class="btn btn-ghost" type="button" id="btn-limpar">Limpar</button>
    </form>
  </div>

  <section id="catalogo-grid" class="grid-cards" aria-live="polite">
    <!-- o JS popula -->
  </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script defer th:src="@{/js/cart.js}"></script>
<script defer th:src="@{/js/pages/catalogo.js}"></script>
</body>
</html>
