<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unidades de medida — Gestão</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/gestao.css}" />
</head>
<body>
  <div th:replace="~{fragments/gestao-nav :: nav}"></div>
  <main class="container mt-4 mb-8">
    <h1 class="text-lg font-semibold mb-16">Unidades de medida</h1>
    <div class="gestao-acoes">
      <a class="btn btn--primary" th:href="@{/gestao/unidades-medida/novo}">Nova unidade</a>
    </div>
    <table class="gestao-tabela">
      <thead>
        <tr><th>Código</th><th>Descrição</th><th>Casas decimais</th><th>Fracionável</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="unidade : ${unidades}">
          <td th:text="${unidade.codigo}"></td>
          <td th:text="${unidade.descricao}"></td>
          <td th:text="${unidade.casasDecimais}"></td>
          <td th:text="${unidade.fracionavel} ? 'Sim' : 'Não'"></td>
          <td th:text="${unidade.ativo} ? 'Ativa' : 'Inativa'"></td>
          <td>
            <a class="btn btn--sm btn--ghost" th:href="@{/gestao/unidades-medida/{id}/editar(id=${unidade.id})}">Editar</a>
            <form th:action="@{/gestao/unidades-medida/{id}/alternar-ativo(id=${unidade.id})}" method="post" style="display:inline;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <input type="hidden" name="ativo" th:value="${!unidade.ativo}" />
              <button class="btn btn--sm btn--ghost" type="submit" th:text="${unidade.ativo} ? 'Desativar' : 'Ativar'"></button>
            </form>
          </td>
        </tr>
        <tr th:if="${unidades.isEmpty()}">
          <td colspan="6">Nenhuma unidade de medida cadastrada ainda.</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
