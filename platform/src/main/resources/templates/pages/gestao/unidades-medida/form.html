<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unidades de medida — Gestão</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/gestao.css}" />
</head>
<body>
  <div th:replace="~{fragments/gestao-nav :: nav}"></div>
  <main class="container mt-4 mb-8">
    <h1 class="text-lg font-semibold mb-16" th:text="${unidade.id == null} ? 'Nova unidade de medida' : 'Editar unidade de medida'"></h1>
    <form class="gestao-form stack gap-16"
          th:action="${unidade.id == null} ? @{/gestao/unidades-medida} : @{/gestao/unidades-medida/{id}(id=${unidade.id})}"
          method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div class="form-group">
        <label for="codigo">Código (ex.: UN, KG, M, CX)</label>
        <input class="input" id="codigo" name="codigo" th:value="${unidade.codigo}" required autofocus="autofocus" />
      </div>
      <div class="form-group">
        <label for="descricao">Descrição</label>
        <input class="input" id="descricao" name="descricao" th:value="${unidade.descricao}" required />
      </div>
      <div class="form-group">
        <label for="casasDecimais">Casas decimais</label>
        <input class="input" type="number" min="0" max="6" id="casasDecimais" name="casasDecimais" th:value="${unidade.casasDecimais}" />
      </div>
      <div class="form-group">
        <label><input type="checkbox" name="fracionavel" value="true" th:checked="${unidade.fracionavel}" /> Fracionável (ex.: kg, m — aceita quantidade quebrada)</label>
      </div>
      <div class="form-group" th:if="${unidade.id != null}">
        <label><input type="checkbox" name="ativo" value="true" th:checked="${unidade.ativo}" /> Ativa</label>
      </div>
      <div class="gestao-acoes">
        <button class="btn btn--primary" type="submit">Salvar</button>
        <a class="btn btn--ghost" th:href="@{/gestao/unidades-medida}">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
