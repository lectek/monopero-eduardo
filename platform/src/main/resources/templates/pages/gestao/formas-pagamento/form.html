<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formas de pagamento — Gestão</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/gestao.css}" />
</head>
<body>
  <div th:replace="~{fragments/gestao-nav :: nav}"></div>
  <main class="container mt-4 mb-8">
    <h1 class="text-lg font-semibold mb-16" th:text="${forma.id == null} ? 'Nova forma de pagamento' : 'Editar forma de pagamento'"></h1>
    <form class="gestao-form stack gap-16"
          th:action="${forma.id == null} ? @{/gestao/formas-pagamento} : @{/gestao/formas-pagamento/{id}(id=${forma.id})}"
          method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div class="form-group">
        <label for="nome">Nome (ex.: Dinheiro, Pix, Cartão de crédito 3x)</label>
        <input class="input" id="nome" name="nome" th:value="${forma.nome}" required autofocus="autofocus" />
      </div>
      <div class="form-group">
        <label for="natureza">Natureza</label>
        <select class="input" id="natureza" name="natureza">
          <option th:each="n : ${naturezas}" th:value="${n}" th:text="${n}" th:selected="${n == forma.natureza}"></option>
        </select>
      </div>
      <div class="form-group">
        <label><input type="checkbox" name="afetaCaixa" value="true" th:checked="${forma.afetaCaixa}" /> Afeta o caixa físico (dinheiro entra/sai da gaveta)</label>
      </div>
      <div class="form-group">
        <label><input type="checkbox" name="permiteParcelamento" value="true" th:checked="${forma.permiteParcelamento}" /> Permite parcelamento</label>
      </div>
      <div class="form-group">
        <label for="maxParcelas">Máximo de parcelas (se permitir parcelamento)</label>
        <input class="input" type="number" min="1" id="maxParcelas" name="maxParcelas" th:value="${forma.maxParcelas}" />
      </div>
      <div class="form-group">
        <label for="prazoRecebimentoDias">Prazo de recebimento (dias, opcional)</label>
        <input class="input" type="number" min="0" id="prazoRecebimentoDias" name="prazoRecebimentoDias" th:value="${forma.prazoRecebimentoDias}" />
      </div>
      <div class="form-group">
        <label for="taxaPercentual">Taxa (%, opcional)</label>
        <input class="input" type="number" step="0.001" min="0" id="taxaPercentual" name="taxaPercentual" th:value="${forma.taxaPercentual}" />
      </div>
      <div class="form-group" th:if="${forma.id != null}">
        <label><input type="checkbox" name="ativo" value="true" th:checked="${forma.ativo}" /> Ativa</label>
      </div>
      <div class="gestao-acoes">
        <button class="btn btn--primary" type="submit">Salvar</button>
        <a class="btn btn--ghost" th:href="@{/gestao/formas-pagamento}">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
