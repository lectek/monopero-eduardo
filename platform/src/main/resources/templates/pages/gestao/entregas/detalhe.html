<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rota de entrega — Gestão</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/gestao.css}" />
</head>
<body>
  <div th:replace="~{fragments/gestao-nav :: nav}"></div>
  <main class="container mt-4 mb-8">
    <p><a th:href="@{/gestao/entregas}">&larr; Voltar pra Entregas</a></p>
    <h1 class="text-lg font-semibold mb-8" th:text="'Rota #' + ${rota.id}"></h1>

    <section class="card p-4 mb-4">
      <p><span class="badge badge--neutral" th:text="${rota.status}"></span></p>
      <p><strong>Origem:</strong> <span th:text="${rota.origem}"></span></p>
      <p><strong>Distância total:</strong> <span th:text="${rota.distanciaTotalKm != null ? rota.distanciaTotalKm + ' km' : '-'}"></span></p>
      <p><strong>Entregador:</strong> <span th:text="${rota.entregador != null ? rota.entregador.nome : 'Ainda não assumida'}"></span></p>
      <p><strong>Comissão do motoboy (<span th:text="${ganho.percentualComissao}"></span>% do frete):</strong>
        já confirmada R$ <span th:text="${ganho.comissaoConfirmada}"></span> —
        prevista pra rota completa R$ <span th:text="${ganho.comissaoProjetadaTotal}"></span>
      </p>

      <form th:if="${rota.status.name() != 'CONCLUIDA' and rota.status.name() != 'CANCELADA'}"
            th:action="@{/gestao/entregas/rotas/{id}/cancelar(id=${rota.id})}" method="post"
            class="stack gap-8 mt-4" style="max-width:420px;"
            onsubmit="return confirm('Cancelar esta rota? As paradas ainda pendentes serão canceladas e as vendas voltam a ficar elegíveis.');">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input class="input" name="motivo" placeholder="Motivo do cancelamento (opcional)" />
        <button class="btn btn--danger" type="submit">Cancelar rota</button>
      </form>
    </section>

    <section class="card p-4">
      <h2 class="text-base font-semibold mb-8">Paradas</h2>
      <div th:each="parada : ${rota.paradas}" class="card p-4 mb-4">
        <p>
          <strong th:text="${parada.ordem} + '. ' + ${parada.clienteNomeSnapshot}"></strong>
          &nbsp; <span class="badge badge--neutral" th:text="${parada.status}"></span>
        </p>
        <p th:text="${parada.enderecoEntregaSnapshot}"></p>
        <p>Frete desta parada: <span th:text="'R$ ' + ${parada.valorFreteSnapshot}"></span></p>
        <p>Código de entrega: <strong th:text="${parada.codigoEntrega}"></strong>
          <form th:action="@{/gestao/entregas/rotas/{id}/paradas/{paradaId}/regenerar-codigo(id=${rota.id},paradaId=${parada.id})}"
                method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn btn--sm btn--ghost" type="submit">Regenerar código</button>
          </form>
        </p>
        <p th:if="${parada.observacao}">Obs.: <span th:text="${parada.observacao}"></span></p>
        <p th:if="${parada.ocorrencias}">Ocorrências: <span th:text="${parada.ocorrencias}"></span></p>
      </div>
      <p th:if="${rota.paradas.isEmpty()}">Nenhuma parada nesta rota.</p>
    </section>
  </main>
</body>
</html>
