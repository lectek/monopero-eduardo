<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Condições de pagamento — Gestão</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/gestao.css}" />
</head>
<body>
  <div th:replace="~{fragments/gestao-nav :: nav}"></div>
  <main class="container mt-4 mb-8">
    <h1 class="text-lg font-semibold mb-16" th:text="${condicao.id == null} ? 'Nova condição de pagamento' : 'Editar condição de pagamento'"></h1>
    <form class="gestao-form stack gap-16"
          th:action="${condicao.id == null} ? @{/gestao/condicoes-pagamento} : @{/gestao/condicoes-pagamento/{id}(id=${condicao.id})}"
          method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div class="form-group">
        <label for="nome">Nome (ex.: À vista, 30/60/90)</label>
        <input class="input" id="nome" name="nome" th:value="${condicao.nome}" required autofocus="autofocus" />
      </div>
      <div class="form-group">
        <label for="parcelas">Número de parcelas</label>
        <input class="input" type="number" min="1" id="parcelas" name="parcelas" th:value="${condicao.parcelas}" required />
      </div>
      <div class="form-group">
        <label for="intervaloDias">Intervalo entre parcelas (dias)</label>
        <input class="input" type="number" min="0" id="intervaloDias" name="intervaloDias" th:value="${condicao.intervaloDias}" required />
      </div>
      <div class="form-group">
        <label for="entradaPercentual">Entrada (%, opcional)</label>
        <input class="input" type="number" step="0.001" min="0" max="100" id="entradaPercentual" name="entradaPercentual" th:value="${condicao.entradaPercentual}" />
      </div>
      <div class="form-group" th:if="${condicao.id != null}">
        <label><input type="checkbox" name="ativo" value="true" th:checked="${condicao.ativo}" /> Ativa</label>
      </div>
      <div class="gestao-acoes">
        <button class="btn btn--primary" type="submit">Salvar</button>
        <a class="btn btn--ghost" th:href="@{/gestao/condicoes-pagamento}">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
