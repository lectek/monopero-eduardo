<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Papéis — Gestão</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/gestao.css}" />
</head>
<body>
  <div th:replace="~{fragments/gestao-nav :: nav}"></div>
  <main class="container mt-4 mb-8">
    <h1 class="text-lg font-semibold mb-16" th:text="${papel == null} ? 'Novo papel' : 'Editar papel'"></h1>
    <form class="gestao-form stack gap-16"
          th:action="${papel == null} ? @{/gestao/papeis} : @{/gestao/papeis/{id}(id=${papel.id})}"
          method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div class="form-group">
        <label for="nome">Nome (ex.: Vendedor, Estoquista, Financeiro)</label>
        <input class="input" id="nome" name="nome" th:value="${papel?.nome}" required autofocus="autofocus" />
      </div>
      <div class="form-group">
        <label for="descricao">Descrição (opcional)</label>
        <input class="input" id="descricao" name="descricao" th:value="${papel?.descricao}" />
      </div>
      <div class="form-group">
        <label>Permissões</label>
        <div th:each="p : ${catalogo}" style="padding:2px 0;">
          <label>
            <input type="checkbox" name="permissoes" th:value="${p.codigo()}"
                   th:checked="${codigosSelecionados.contains(p.codigo())}" />
            <strong th:text="${p.modulo()}"></strong> — <span th:text="${p.descricao()}"></span>
          </label>
        </div>
      </div>
      <div class="gestao-acoes">
        <button class="btn btn--primary" type="submit">Salvar</button>
        <a class="btn btn--ghost" th:href="@{/gestao/papeis}">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
