<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestão — login</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/gestao.css}" />
</head>
<body class="body-flex">
  <main class="container mt-4 mb-8">
    <div class="card p-4 stack gap-16" style="max-width:360px;margin-inline:auto;margin-top:4rem;">
      <h1 class="text-base font-semibold">Painel de Gestão</h1>

      <div class="alert alert-error" th:if="${param.erro}">E-mail ou senha inválidos.</div>
      <div class="alert alert-info" th:if="${param.saiu}">Sessão encerrada.</div>

      <form th:action="@{/gestao/login}" method="post" class="stack gap-8">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input class="input" type="email" name="email" placeholder="E-mail" required autofocus="autofocus" />
        <input class="input" type="password" name="senha" placeholder="Senha" required />
        <button class="btn btn--primary" type="submit">Entrar</button>
      </form>
    </div>
  </main>
</body>
</html>
