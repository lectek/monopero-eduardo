<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Locais de estoque — Gestão</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/gestao.css}" />
</head>
<body>
  <div th:replace="~{fragments/gestao-nav :: nav}"></div>
  <main class="container mt-4 mb-8">
    <h1 class="text-lg font-semibold mb-16" th:text="${local.id == null} ? 'Novo local de estoque' : 'Editar local de estoque'"></h1>
    <form class="gestao-form stack gap-16"
          th:action="${local.id == null} ? @{/gestao/locais-estoque} : @{/gestao/locais-estoque/{id}(id=${local.id})}"
          method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div class="form-group">
        <label for="nome">Nome (ex.: Loja, Depósito, Filial Centro)</label>
        <input class="input" id="nome" name="nome" th:value="${local.nome}" required autofocus="autofocus" />
      </div>
      <div class="form-group">
        <label for="tipo">Tipo (livre, opcional — ex.: LOJA, DEPOSITO)</label>
        <input class="input" id="tipo" name="tipo" th:value="${local.tipo}" />
      </div>
      <div class="form-group">
        <label><input type="checkbox" name="principal" value="true" th:checked="${local.principal}" /> Principal (pré-selecionado no PDV)</label>
      </div>
      <div class="form-group" th:if="${local.id != null}">
        <label><input type="checkbox" name="ativo" value="true" th:checked="${local.ativo}" /> Ativo</label>
      </div>
      <div class="gestao-acoes">
        <button class="btn btn--primary" type="submit">Salvar</button>
        <a class="btn btn--ghost" th:href="@{/gestao/locais-estoque}">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
