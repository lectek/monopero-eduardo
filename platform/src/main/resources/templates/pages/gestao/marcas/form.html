<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marcas — Gestão</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/gestao.css}" />
</head>
<body>
  <div th:replace="~{fragments/gestao-nav :: nav}"></div>
  <main class="container mt-4 mb-8">
    <h1 class="text-lg font-semibold mb-16" th:text="${marca.id == null} ? 'Nova marca' : 'Editar marca'"></h1>
    <form class="gestao-form stack gap-16"
          th:action="${marca.id == null} ? @{/gestao/marcas} : @{/gestao/marcas/{id}(id=${marca.id})}"
          method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div class="form-group">
        <label for="nome">Nome</label>
        <input class="input" id="nome" name="nome" th:value="${marca.nome}" required autofocus="autofocus" />
      </div>
      <div class="form-group">
        <label for="fabricante">Fabricante (opcional)</label>
        <input class="input" id="fabricante" name="fabricante" th:value="${marca.fabricante}" />
      </div>
      <div class="form-group" th:if="${marca.id != null}">
        <label><input type="checkbox" name="ativo" value="true" th:checked="${marca.ativo}" /> Ativa</label>
      </div>
      <div class="gestao-acoes">
        <button class="btn btn--primary" type="submit">Salvar</button>
        <a class="btn btn--ghost" th:href="@{/gestao/marcas}">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
