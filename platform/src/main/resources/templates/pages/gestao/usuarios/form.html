<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Usuários — Gestão</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/gestao.css}" />
</head>
<body>
  <div th:replace="~{fragments/gestao-nav :: nav}"></div>
  <main class="container mt-4 mb-8">
    <h1 class="text-lg font-semibold mb-16" th:text="${usuario == null} ? 'Novo usuário' : 'Editar usuário'"></h1>
    <form class="gestao-form stack gap-16"
          th:action="${usuario == null} ? @{/gestao/usuarios} : @{/gestao/usuarios/{id}(id=${usuario.id})}"
          method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div class="form-group">
        <label for="nome">Nome</label>
        <input class="input" id="nome" name="nome" th:value="${usuario?.nome}" required autofocus="autofocus" />
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input class="input" type="email" id="email" name="email" th:value="${usuario?.email}"
               th:readonly="${usuario != null}" required />
      </div>
      <div class="form-group" th:if="${usuario == null}">
        <label for="senha">Senha inicial</label>
        <input class="input" type="password" id="senha" name="senha" required minlength="8" />
      </div>
      <div class="form-group">
        <label>Papéis</label>
        <div th:each="p : ${papeis}" style="padding:2px 0;">
          <label>
            <input type="checkbox" name="papelIds" th:value="${p.id}"
                   th:checked="${papelIdsSelecionados.contains(p.id)}" />
            <span th:text="${p.nome}"></span>
          </label>
        </div>
      </div>
      <div class="form-group" th:if="${usuario != null}">
        <label><input type="checkbox" name="ativo" value="true" th:checked="${usuario.ativo}" /> Ativo</label>
      </div>
      <div class="gestao-acoes">
        <button class="btn btn--primary" type="submit">Salvar</button>
        <a class="btn btn--ghost" th:href="@{/gestao/usuarios}">Cancelar</a>
      </div>
    </form>

    <form th:if="${usuario != null}" class="gestao-form stack gap-16 mt-8"
          th:action="@{/gestao/usuarios/{id}/redefinir-senha(id=${usuario.id})}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div class="form-group">
        <label for="novaSenha">Redefinir senha</label>
        <input class="input" type="password" id="novaSenha" name="novaSenha" required minlength="8" />
      </div>
      <div class="gestao-acoes">
        <button class="btn btn--secondary" type="submit">Redefinir senha</button>
      </div>
    </form>
  </main>
</body>
</html>
