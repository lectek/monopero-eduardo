<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produtos — Gestão</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/gestao.css}" />
</head>
<body>
  <div th:replace="~{fragments/gestao-nav :: nav}"></div>
  <main class="container mt-4 mb-8">
    <h1 class="text-lg font-semibold mb-16">Produtos</h1>
    <div class="gestao-acoes">
      <a class="btn btn--primary" th:href="@{/gestao/produtos/novo}">Novo produto</a>
    </div>
    <table class="gestao-tabela">
      <thead>
        <tr><th>Nome</th><th>Código</th><th>Categoria</th><th>Marca</th><th>Preço</th><th>Status</th><th>Controla estoque</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="produto : ${produtos}">
          <td th:text="${produto.nome}"></td>
          <td th:text="${produto.codigoInterno}"></td>
          <td th:text="${produto.categoria != null ? produto.categoria.nome : '—'}"></td>
          <td th:text="${produto.marca != null ? produto.marca.nome : '—'}"></td>
          <td th:text="${produto.precoVenda}"></td>
          <td th:text="${produto.status}"></td>
          <td th:text="${produto.controlaEstoque} ? 'Sim' : 'Não'"></td>
          <td>
            <a class="btn btn--sm btn--ghost" th:href="@{/gestao/produtos/{id}/editar(id=${produto.id})}">Editar</a>
          </td>
        </tr>
        <tr th:if="${produtos.isEmpty()}">
          <td colspan="8">Nenhum produto cadastrado ainda.</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
