<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produtos — Gestão</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/gestao.css}" />
</head>
<body>
  <div th:replace="~{fragments/gestao-nav :: nav}"></div>
  <main class="container mt-4 mb-8">
    <h1 class="text-lg font-semibold mb-16" th:text="${produto == null} ? 'Novo produto' : 'Editar produto'"></h1>
    <form class="gestao-form stack gap-16"
          th:action="${produto == null} ? @{/gestao/produtos} : @{/gestao/produtos/{id}(id=${produto.id})}"
          method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="form-group">
        <label for="nome">Nome</label>
        <input class="input" id="nome" name="nome" th:value="${produto?.nome}" required autofocus="autofocus" />
      </div>
      <div class="form-group">
        <label for="unidadeEstoqueId">Unidade de estoque</label>
        <select class="input" id="unidadeEstoqueId" name="unidadeEstoqueId" required>
          <option value="">— selecione —</option>
          <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.codigo + ' — ' + u.descricao}"
                  th:selected="${u.id == produto?.unidadeEstoque?.id}"></option>
        </select>
      </div>
      <div class="form-group">
        <label for="codigoInterno">Código interno (opcional — código de barras, SKU)</label>
        <input class="input" id="codigoInterno" name="codigoInterno" th:value="${produto?.codigoInterno}" />
      </div>
      <div class="form-group">
        <label for="descricao">Descrição (opcional)</label>
        <textarea class="input" id="descricao" name="descricao" th:text="${produto?.descricao}"></textarea>
      </div>
      <div class="form-group">
        <label for="categoriaId">Categoria (opcional)</label>
        <select class="input" id="categoriaId" name="categoriaId">
          <option value="">— nenhuma —</option>
          <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}" th:selected="${c.id == produto?.categoria?.id}"></option>
        </select>
      </div>
      <div class="form-group">
        <label for="marcaId">Marca (opcional)</label>
        <select class="input" id="marcaId" name="marcaId">
          <option value="">— nenhuma —</option>
          <option th:each="m : ${marcas}" th:value="${m.id}" th:text="${m.nome}" th:selected="${m.id == produto?.marca?.id}"></option>
        </select>
      </div>
      <div class="form-group">
        <label for="fabricante">Fabricante (texto livre, opcional)</label>
        <input class="input" id="fabricante" name="fabricante" th:value="${produto?.fabricante}" />
      </div>
      <div class="form-group">
        <label for="localEstoquePadraoId">Local de estoque padrão (opcional)</label>
        <select class="input" id="localEstoquePadraoId" name="localEstoquePadraoId">
          <option value="">— nenhum —</option>
          <option th:each="l : ${locaisEstoque}" th:value="${l.id}" th:text="${l.nome}" th:selected="${l.id == produto?.localEstoquePadrao?.id}"></option>
        </select>
      </div>
      <div class="form-group">
        <label for="precoVenda">Preço de venda (opcional)</label>
        <input class="input" type="number" step="0.0001" min="0" id="precoVenda" name="precoVenda" th:value="${produto?.precoVenda}" />
      </div>
      <div class="form-group">
        <label for="custoAquisicao">Custo de aquisição (opcional)</label>
        <input class="input" type="number" step="0.0001" min="0" id="custoAquisicao" name="custoAquisicao" th:value="${produto?.custoAquisicao}" />
      </div>
      <div class="form-group" th:if="${produto != null}">
        <label for="motivoAlteracaoPreco">Motivo da alteração de preço/custo (só se mudar algum dos dois acima)</label>
        <input class="input" id="motivoAlteracaoPreco" name="motivoAlteracaoPreco" placeholder="ex.: reajuste de fornecedor" />
      </div>
      <div class="form-group">
        <label for="estoqueMinimo">Estoque mínimo (opcional)</label>
        <input class="input" type="number" step="0.000001" min="0" id="estoqueMinimo" name="estoqueMinimo" th:value="${produto?.estoqueMinimo}" />
      </div>
      <div class="form-group">
        <label for="estoqueMaximo">Estoque máximo (opcional)</label>
        <input class="input" type="number" step="0.000001" min="0" id="estoqueMaximo" name="estoqueMaximo" th:value="${produto?.estoqueMaximo}" />
      </div>
      <div class="form-group">
        <label><input type="checkbox" name="controlaEstoque" value="true" th:checked="${produto == null ? true : produto.controlaEstoque}" /> Controla estoque (desmarque pra serviços/mão de obra)</label>
      </div>
      <div class="form-group">
        <label><input type="checkbox" name="permiteVendaSemEstoque" value="true" th:checked="${produto?.permiteVendaSemEstoque}" /> Permite vender mesmo sem saldo em estoque</label>
      </div>
      <div class="form-group" th:if="${produto != null}">
        <label for="status">Status</label>
        <select class="input" id="status" name="status">
          <option th:each="s : ${statusValores}" th:value="${s}" th:text="${s}" th:selected="${s == produto.status}"></option>
        </select>
      </div>
      <div class="gestao-acoes">
        <button class="btn btn--primary" type="submit">Salvar</button>
        <a class="btn btn--ghost" th:href="@{/gestao/produtos}">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
