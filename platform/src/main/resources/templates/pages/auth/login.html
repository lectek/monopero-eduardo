<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — Rota das Praias</title>
  <link rel="icon" type="image/png" th:href="@{/images/logo-rota-das-praias.png}" />
  <link rel="stylesheet" th:href="@{/css/main.css(v=${#dates.createNow().time})}" />
</head>
<body class="body-flex">
  <header th:replace="~{fragments/header :: header}"></header>

  <main id="main-content" class="container mt-4 mb-8">
    <div class="card p-4 stack gap-16" style="max-width:360px;margin-inline:auto;">
      <h1 class="text-base font-semibold">Entrar</h1>

      <div class="alert alert-error" th:if="${param.error}">E-mail ou senha inválidos.</div>
      <div class="alert" th:if="${cadastroOk}">Conta criada! Entre com seu e-mail e senha.</div>

      <form method="post" th:action="@{/login}" class="stack gap-8">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input class="input" type="email" name="email" placeholder="E-mail" required autofocus="autofocus" />
        <input class="input" type="password" name="senha" placeholder="Senha" required />
        <button class="btn btn--primary" type="submit">Entrar</button>
      </form>

      <div th:if="${googleLoginEnabled}" class="stack gap-8">
        <span>ou</span>
        <a class="btn" href="/oauth2/authorization/google">Entrar com Google</a>
      </div>

      <p>Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
    </div>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
  <script defer th:src="@{/js/cart.js}"></script>
</body>
</html>
