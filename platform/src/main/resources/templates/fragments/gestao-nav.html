<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav" class="gestao-nav">
  <span class="gestao-nav__marca">Gestão</span>
  <a th:href="@{/gestao/produtos}">Produtos</a>
  <a th:href="@{/gestao/marcas}">Marcas</a>
  <a th:href="@{/gestao/unidades-medida}">Unidades de medida</a>
  <a th:href="@{/gestao/formas-pagamento}">Formas de pagamento</a>
  <a th:href="@{/gestao/locais-estoque}">Locais de estoque</a>
  <a th:href="@{/gestao/condicoes-pagamento}">Condições de pagamento</a>
  <a th:href="@{/gestao/tipos-movimentacao}">Tipos de movimentação</a>
  <span class="gestao-nav__espaco"></span>
  <span class="gestao-nav__usuario" sec:authentication="principal">—</span>
  <form th:action="@{/gestao/logout}" method="post" style="display:inline;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <button type="submit" class="btn btn--ghost btn--sm">Sair</button>
  </form>
</nav>
</body>
</html>
