<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav" class="gestao-nav">
  <a th:href="@{/gestao}" class="gestao-nav__marca">Gestão</a>
  <a th:href="@{/gestao/produtos}" sec:authorize="hasAuthority('PRODUTO_LER')">Produtos</a>
  <a th:href="@{/gestao/marcas}" sec:authorize="hasAuthority('CADASTRO_GERENCIAR')">Marcas</a>
  <a th:href="@{/gestao/unidades-medida}" sec:authorize="hasAuthority('CADASTRO_GERENCIAR')">Unidades de medida</a>
  <a th:href="@{/gestao/formas-pagamento}" sec:authorize="hasAuthority('CADASTRO_GERENCIAR')">Formas de pagamento</a>
  <a th:href="@{/gestao/locais-estoque}" sec:authorize="hasAuthority('CADASTRO_GERENCIAR')">Locais de estoque</a>
  <a th:href="@{/gestao/condicoes-pagamento}" sec:authorize="hasAuthority('CADASTRO_GERENCIAR')">Condições de pagamento</a>
  <a th:href="@{/gestao/tipos-movimentacao}" sec:authorize="hasAuthority('CADASTRO_GERENCIAR')">Tipos de movimentação</a>
  <a th:href="@{/gestao/entregas}" sec:authorize="hasAuthority('ENTREGA_GERENCIAR')">Entregas</a>
  <a th:href="@{/gestao/motoboy}" sec:authorize="hasAuthority('ENTREGA_EXECUTAR')">Minhas rotas</a>
  <a th:href="@{/gestao/usuarios}" sec:authorize="hasAuthority('USUARIO_GERENCIAR')">Usuários</a>
  <a th:href="@{/gestao/papeis}" sec:authorize="hasAuthority('USUARIO_GERENCIAR')">Papéis</a>
  <span class="gestao-nav__espaco"></span>
  <span class="gestao-nav__usuario" sec:authentication="principal">—</span>
  <form th:action="@{/gestao/logout}" method="post" style="display:inline;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <button type="submit" class="btn btn--ghost btn--sm">Sair</button>
  </form>
</nav>
</body>
</html>
